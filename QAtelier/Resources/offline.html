/* ── 로그인 첫 화면: 왼쪽 판과 등장 (2026-10-22 오너 결정) ─────────────────────────────
   세 제품(Q-Atelier · Q-Maison · Q-Carnet)이 같은 짜임 · 같은 박자로 선다. 오너가 시안 넷 가운데 «가» 를 골랐다:
   제품 배경 그림 위에 입체 금속 Q · 제품 이름 · 한글 한 줄. 강조색은 세 제품 공통 샴페인 그대로다.
   등장은 «부드러운 가속 후 부드러운 감속 후 정지» (같은 날 오너). 첫 장면은 판이 화면 전체를 덮고 Q 가 떠오른 뒤,
   판이 제 넓이로 물러나며 폼이 한 줄씩 선다. 전체 3초. 폰(1024 미만)은 판이 없어 폼 위 작은 Q 와 글이 1초 남짓에 선다.

   쓰는 법
     뿌리 요소       .qd-auth-stage + data-qd-intro="on" | "off". 제품의 작은 클라이언트 부품이 처음엔 on 으로
                     그리고, 누르거나 키를 치면 또는 3.1초 뒤에 off 로 바꾼다(그 뒤 새로 붙는 줄은 움직이지 않는다).
                     🔑 3초는 제품의 등장 길이 상수와 같아야 한다. 이 박자를 바꾸면 그 상수도 바꾼다.
     왼쪽 판         .qd-auth-panel (제품의 넓은 화면 판 요소에 함께 붙인다 · 보이기와 sticky 는 제품 규칙)
       배경          .qd-auth-panel-bg (화면 크기로 깔려 판이 좁아지면 왼쪽만 남는다)
       가운데        .qd-auth-panel-center > .qd-auth-mark + .qd-auth-ident
     금속 Q          .qd-auth-mark > img.qd-auth-mark-img(src /login-mark.webp) + .qd-auth-mark-sheen
     이름 · 한 줄    .qd-auth-ident > .qd-auth-name + .qd-auth-line
     폰 머리         .qd-auth-phone (폼 위 · 같은 .qd-auth-mark · .qd-auth-ident 를 담는다 · 보이기는 제품 규칙)
     늦게 오는 것    .qd-auth-late (밝기 고르개)
     폼의 줄         data-qd-row="0" ~ "11" (위에서부터 차례 · 같은 번호면 같이 선다 · 줄 안에 줄을 넣지 않는다)
   제품이 테마마다 정하는 값: --qd-auth-panel-image(배경 그림 url) · --qd-auth-panel-surface(그림이 오기 전 바탕) ·
     --qd-auth-mark-dim(어두운 테마에서 Q 가 어둡게 시작하는 정도) · --qd-auth-sheen-color · --qd-auth-sheen-opacity.
   그림 셋(login-mark.webp · login-bg-dark.jpg · login-bg-light.jpg)은 tools/app-icons.mjs 가 제품 public 에 나눠 준다.
   판은 칸 넓이를 넘어 화면 전체로 시작하므로, 두 칸은 minmax(0, …) 여야 판이 오른쪽 칸을 밀어내지 않는다
   (--qd-auth-columns). 넘친 만큼은 뿌리 요소가 overflow: clip 으로 자른다.
   키프레임은 시작 모습(from)만 적는다. 끝 모습은 늘 제 모양이라, 움직임이 꺼져도(off · 움직임 줄이기) 같은 화면이다. */
.qd-auth-stage {
  --qd-auth-mark-size: 200px;
  --qd-auth-mark-size-phone: 64px;
  --qd-auth-name-size: 28px;
  --qd-auth-name-size-phone: 24px;
  --qd-auth-line-size: 14px;
  --qd-auth-line-size-phone: 14px;
  --qd-auth-intro-ease: cubic-bezier(0.45, 0, 0.2, 1);
  --qd-auth-intro-smooth: cubic-bezier(0.37, 0, 0.63, 1);
  --qd-auth-intro-sheen-ease: cubic-bezier(0.5, 0, 0.3, 1);
  --qd-auth-bg-fade: 1000ms;
  --qd-auth-bg-settle: 3000ms;
  --qd-auth-mark-for: 600ms;
  --qd-auth-dim-for: 1400ms;
  --qd-auth-sheen-at: 350ms;
  --qd-auth-sheen-for: 600ms;
  --qd-auth-open-at: 900ms;
  --qd-auth-open-for: 1500ms;
  --qd-auth-ident-at: 1700ms;
  --qd-auth-ident-for: 700ms;
  --qd-auth-late-at: 2000ms;
  --qd-auth-late-for: 700ms;
  --qd-auth-rows-at: 1700ms;
  --qd-auth-row-step: 50ms;
  --qd-auth-row-for: 600ms;
  overflow: clip;
}
@media (max-width: 1023.98px) {
  .qd-auth-stage {
    --qd-auth-mark-for: 500ms;
    --qd-auth-dim-for: 900ms;
    --qd-auth-sheen-at: 150ms;
    --qd-auth-sheen-for: 500ms;
    --qd-auth-ident-at: 200ms;
    --qd-auth-ident-for: 500ms;
    --qd-auth-late-at: 400ms;
    --qd-auth-late-for: 500ms;
    --qd-auth-rows-at: 300ms;
    --qd-auth-row-step: 40ms;
    --qd-auth-row-for: 500ms;
  }
}
.qd-auth-panel { box-sizing: border-box; width: 100%; overflow: clip; flex-direction: column; align-items: center; justify-content: center; background: var(--qd-auth-panel-surface, var(--qd-bg)); }
.qd-auth-panel-bg {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 0;
  width: 100vw;
  height: 100vh;
  background: var(--qd-auth-panel-image, none) center / cover no-repeat;
  pointer-events: none;
}
