# 애플 서명을 붙여 TestFlight 로 올린다. 올린 판은 오빠 아이폰 · 아이패드의 TestFlight 앱에 뜬다(내부 시험 전용).
# 열쇠는 저장소의 «testflight» 환경 비밀값에만 둔다. 이 환경은 main 에서만 열리고 풀 리퀘스트로는 돌지 않는다.
#   ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_P8(.p8 파일 전체) : App Store Connect API 팀 열쇠. 역할은 «관리(Admin)» 여야
#     서명이 된다(애플 서버가 쥔 배포 인증서는 관리 권한 열쇠만 쓸 수 있다)
#   APPLE_TEAM_ID : 애플 개발자 계정의 팀 ID(10자)
# 비밀값이 아직 없으면 올리기를 건너뛰고 초록으로 끝난다.
name: TestFlight 올리기

on:
  push:
    branches: [main]
    paths:
      - "QAtelier/**"
      - "project.yml"
      - "ci/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

# 올리는 중에 끊지 않는다(다음 판은 줄 서서 기다린다)
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  ready:
    name: 열쇠가 있는지
    runs-on: ubuntu-latest
    environment: testflight
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "비밀값 넷이 다 있습니다. 올리기로 넘어갑니다."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=TestFlight 건너뜀::testflight 환경에 비밀값이 아직 없습니다:$missing"
          fi

  upload:
    name: 서명 · TestFlight 로 올리기
    needs: ready
    if: needs.ready.outputs.ok == 'true'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 40
    steps:
      # 열쇠를 쓰는 작업이라 남의 코드는 커밋 번호로 고정해 받는다
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 도구 판 확인
        run: xcodebuild -version

      - name: XcodeGen 받기(해시 확인)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          XG=$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)
          test -n "$XG"
          echo "XCODEGEN=$XG" >> "$GITHUB_ENV"
          "$XG" --version

      - name: Xcode 프로젝트 만들기
        run: '"$XCODEGEN" generate'

      # 서명 없이 묶는다. 서명은 다음 단계(내보내기)에서 애플 서버가 쥔 배포 인증서로 한 번만 한다.
      # 여기서 서명하면 빈 맥마다 개발 인증서를 새로 만들려다 계정 한도에 걸린다.
      # 빌드 번호는 올린 때(UTC)로 매긴다. 같은 판(1.0.0) 안에서 늘 커지므로 TestFlight 가 거절하지 않는다
      - name: 묶기(archive · 서명 없음)
        run: |
          BUILD_NO=$(date -u +%Y%m%d.%H%M)
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          set +e
          xcodebuild -project QAtelier.xcodeproj -scheme QAtelier -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/QAtelier.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NO" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > archive.log 2>&1
          code=$?
          set -e
          grep -E "(error|warning): " archive.log | sort -u | head -80 || true
          tail -3 archive.log
          exit $code

      # 묶음이 생긴 것만으로 넘어가지 않는다. 기기용인지 · 빌드 번호가 들어갔는지 읽어서 본다
      - name: 묶음 확인
        run: |
          set -euo pipefail
          AI=build/QAtelier.xcarchive/Info.plist
          APP=build/QAtelier.xcarchive/Products/Applications/QAtelier.app
          VER=$(plutil -extract ApplicationProperties.CFBundleShortVersionString raw "$AI")
          BLD=$(plutil -extract ApplicationProperties.CFBundleVersion raw "$AI")
          test "$BLD" = "$BUILD_NO" || { echo "::error::빌드 번호가 안 들어감($BLD)"; exit 1; }
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = "app.medqraft.qatelier"
          xcrun vtool -show-build "$APP/QAtelier" > vtool.txt
          grep -Eiq '^[[:space:]]*platform[[:space:]]+(IOS|2)[[:space:]]*$' vtool.txt || { echo "::error::기기용(IOS)이 아님"; exit 1; }
          echo "APP_VER=$VER" >> "$GITHUB_ENV"
          echo "묶음: 판 $VER ($BLD) · 기기용"

      - name: 서명해 올리기
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          KEY="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY"
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8 이 .p8 파일 모양이 아닙니다(BEGIN 줄부터 END 줄까지 전체를 넣어야 합니다)"; exit 1; }
          OPTS="$RUNNER_TEMP/asc/ExportOptions.plist"
          cp ci/ExportOptions-testflight.plist "$OPTS"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$OPTS"
          plutil -lint "$OPTS"
          set +e
          xcodebuild -exportArchive -archivePath build/QAtelier.xcarchive \
            -exportOptionsPlist "$OPTS" -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > export.log 2>&1
          code=$?
          set -e
          # 전체 기록은 공개 저장소의 작업 기록에 남기지 않는다(계정 정보가 섞일 수 있다). 오류 줄과 끝만 보인다
          grep -Ei "error|warning|fail" export.log | sort -u | head -40 || true
          tail -5 export.log
          if [ $code -ne 0 ]; then
            grep -q "No suitable application records" export.log && echo "::error::App Store Connect 에 앱(app.medqraft.qatelier)이 아직 없습니다. «앱 › 신규 앱» 으로 먼저 만들어야 합니다"
            grep -q "Cloud signing permission" export.log && echo "::error::열쇠의 역할이 «관리(Admin)» 가 아닙니다. 관리 역할로 새 열쇠를 만들어야 합니다"
            grep -Eqi "agreement" export.log && echo "::error::애플 개발자 계정에 동의하지 않은 약관이 있습니다. developer.apple.com 에서 약관에 동의해야 합니다"
            grep -Eqi "401|authentication credentials|NOT_AUTHORIZED" export.log && echo "::error::열쇠 ID · 발급자 ID · .p8 중 맞지 않는 것이 있습니다"
            exit $code
          fi
          {
            echo "### TestFlight 에 올렸습니다"
            echo "- 판: $APP_VER ($BUILD_NO)"
            echo "- 커밋: $GITHUB_SHA"
            echo "- 애플이 처리하는 데 보통 몇 분에서 30분쯤 걸리고, 그 뒤 TestFlight 앱에 뜹니다"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "올림: 판 $APP_VER ($BUILD_NO)"

      - name: 열쇠 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
